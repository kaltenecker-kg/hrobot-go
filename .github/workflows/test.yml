name: Tests

on:
  pull_request:
    paths-ignore:
      # Documentation and local-tooling files that no CI job reads. Listed as
      # paths-ignore rather than paths so an unrecognised new file still runs
      # the jobs — the safe direction to be wrong in.
      #
      # Deliberately absent: spec/robot.yaml (loaded from disk at test time by
      # spectest.Load, so it is a test input despite not being compiled),
      # .golangci.yml (the Build job lints), go.mod/go.sum, and
      # .github/workflows/** (a CI change must exercise CI).
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      # CI inlines its own go/golangci-lint commands and never invokes these.
      - 'GNUmakefile'
      - 'Taskfile.yml'
      - '.husky/**'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
  # Only on main; pushes to a PR branch are already covered by the pull_request
  # trigger, so restricting this avoids running every job twice per push.
  push:
    branches:
      - main
    paths-ignore:
      # Kept in sync with the list above by hand; Actions has no YAML anchors.
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      # CI inlines its own go/golangci-lint commands and never invokes these.
      - 'GNUmakefile'
      - 'Taskfile.yml'
      - '.husky/**'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the GITHUB_TOKEN out of .git/config
          # where later steps (and any tool they run) could read it.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # go.mod pins the minimum (1.26); fetch the latest 1.26.x patch so CI
          # picks up standard-library security fixes (e.g. the 1.26.5 crypto/tls
          # fix) instead of a stale runner-preinstalled patch.
          check-latest: true
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - name: go vet
        run: go vet ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # `latest` rather than a pinned version: Dependabot cannot bump a
          # version string in a `with:` block, and a pin nobody bumps just
          # rots. The action itself is SHA-pinned, and the linter is a check,
          # not a build input, so a surprise upgrade can only fail CI.
          version: latest

  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # go.mod pins the minimum (1.26); fetch the latest 1.26.x patch so CI
          # picks up standard-library security fixes (e.g. the 1.26.5 crypto/tls
          # fix) instead of a stale runner-preinstalled patch.
          check-latest: true
          cache: true
      - run: go mod download
      - run: go test -v -race -cover -timeout=180s ./...

  quality:
    name: Module Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # go.mod pins the minimum (1.26); fetch the latest 1.26.x patch so CI
          # picks up standard-library security fixes (e.g. the 1.26.5 crypto/tls
          # fix) instead of a stale runner-preinstalled patch.
          check-latest: true
          cache: true
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify
      - name: govulncheck
        # @latest on purpose: a scanner should be current, Dependabot cannot
        # bump a version literal here, and the module proxy plus
        # sum.golang.org verify whatever version resolves. Same command as
        # `make vulncheck`; the vulnerability database is fetched fresh at
        # run time.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
