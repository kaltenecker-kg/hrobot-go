name: Markdown

on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'
  # Only on main; pushes to a PR branch are already covered by the pull_request
  # trigger, so restricting this avoids running every job twice per push.
  push:
    branches:
      - main
    # Kept in sync with the list above by hand; Actions has no YAML anchors.
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown Lint
    # Pinned OS release (ubuntu-latest moves to the next LTS unannounced).
    # Dependabot cannot bump runner labels; move it by hand before GitHub
    # retires the image.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so keep the GITHUB_TOKEN out of .git/config
          # where later steps (pnpm install runs lifecycle scripts) could
          # read it.
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Active LTS. markdownlint-cli2 requires Node >= 22 (see package.json
          # engines), so 22 still works locally.
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs the exact command from the local pre-commit hook, driven entirely
      # by .markdownlint-cli2.jsonc (rules + globs), so CI and local stay in
      # sync — including the docs/**/*.md glob.
      - name: Lint markdown
        run: pnpm lint:md
