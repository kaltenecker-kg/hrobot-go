name: Markdown

on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'
  # Only on main; pushes to a PR branch are already covered by the pull_request
  # trigger, so restricting this avoids running every job twice per push.
  push:
    branches:
      - main
    # Kept in sync with the list above by hand; Actions has no YAML anchors.
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # markdownlint-cli2 requires Node >= 22 (see package.json engines).
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs the exact command from the local pre-commit hook, driven entirely
      # by .markdownlint-cli2.jsonc (rules + globs), so CI and local stay in
      # sync — including the docs/**/*.md glob.
      - name: Lint markdown
        run: pnpm lint:md
