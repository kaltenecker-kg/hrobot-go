name: Markdown

on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'
  # Only on main; pushes to a PR branch are already covered by the pull_request
  # trigger, so restricting this avoids running every job twice per push.
  push:
    branches:
      - main
    # Kept in sync with the list above by hand; Actions has no YAML anchors.
    paths:
      - '**.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/markdown.yml'

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # markdownlint-cli2 requires Node >= 22 (see package.json engines).
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs the exact command from the local pre-commit hook, driven entirely
      # by .markdownlint-cli2.jsonc (rules + globs), so CI and local stay in
      # sync — including the docs/**/*.md glob.
      - name: Lint markdown
        run: pnpm lint:md
